global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: game01-gateway
    static_configs:
      - targets: ["gateway:8080", "gateway-2:8080"]

  - job_name: game01-usercenter
    static_configs:
      - targets: ["usercenter:8080"]

  - job_name: game01-lobby
    static_configs:
      - targets: ["lobby:8080"]

  - job_name: game01-battle
    static_configs:
      - targets: ["battle:8080"]
