app:
  name: game-server
  instance_id: game-server-production
  environment: production
  shutdown_timeout: 30s

http:
  address: ":8080"
  read_timeout: 10s
  write_timeout: 10s

grpc:
  listen_address: ":9090"
  advertise_address: "game-server:9090"

gateway:
  session_ttl: 24h
  reconnect_grace_period: 30s
  heartbeat_interval: 10s
  heartbeat_timeout: 30s

usercenter:
  refresh_token_ttl: 720h

redis:
  address: "redis:6379"
  password: ""
  db: 0

mongo:
  uri: "mongodb://mongo:27017"
  database: "game01"
  connect_timeout: 5s
  auth_mechanism: "SCRAM-SHA-256"
  auth_source: "admin"
  username: ""
  password: ""

discovery:
  provider: etcd
  endpoints:
    - "etcd:2379"
  namespace: "/services/game01"
  lease_ttl: 10

id_generator:
  node_id: 1

services:
  gateway: { enabled: true }
  usercenter: { enabled: true }
  lobby: { enabled: true }
  battle: { enabled: true }

battle:
  tick_rate: 20
  max_players_per_room: 8
