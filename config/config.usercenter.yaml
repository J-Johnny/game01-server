app:
  name: usercenter
  instance_id: usercenter-local
  environment: local
  shutdown_timeout: 15s
http:
  address: ":8080"
  read_timeout: 10s
  write_timeout: 10s
grpc:
  listen_address: ":9090"
  advertise_address: "usercenter:9090"
gateway:
  session_ttl: 24h
  reconnect_grace_period: 30s
  heartbeat_interval: 10s
  heartbeat_timeout: 30s
  drain_timeout: 10s
usercenter:
  refresh_token_ttl: 720h
  idempotency_ttl: 24h
redis:
  address: "redis:6379"
  password: ""
  db: 0
mongo:
  uri: "mongodb://mongo:27017"
  database: "game01"
  connect_timeout: 5s
discovery:
  provider: etcd
  endpoints:
    - "etcd:2379"
  namespace: "/services/game01"
  lease_ttl: 10
id_generator:
  node_id: 2
services:
  gateway: { enabled: false }
  usercenter: { enabled: true }
  lobby: { enabled: false }
  battle: { enabled: false }
battle:
  tick_rate: 20
  max_players_per_room: 8
