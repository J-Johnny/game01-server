syntax = "proto3";

package game01.internal;

option go_package = "server/proto/gen/internalpb;internalpb";

enum LobbyMessageId {
  LOBBY_MESSAGE_ID_UNSPECIFIED = 0;
  LOBBY_MESSAGE_ID_ENSURE_PLAYER_REQUEST = 3001;
  LOBBY_MESSAGE_ID_ENSURE_PLAYER_RESPONSE = 3101;
  LOBBY_MESSAGE_ID_SETTLEMENT_REQUEST = 3002;
  LOBBY_MESSAGE_ID_SETTLEMENT_RESPONSE = 3102;
  LOBBY_MESSAGE_ID_ENTER_REQUEST = 3003;
  LOBBY_MESSAGE_ID_ENTER_RESPONSE = 3103;
  LOBBY_MESSAGE_ID_LEAVE_REQUEST = 3004;
  LOBBY_MESSAGE_ID_LEAVE_RESPONSE = 3104;
}

message EnsurePlayerRequest {
  string account_id = 1;
}

message EnsurePlayerResponse {
  string account_id = 1;
  string player_id = 2;
  bool created = 3;
}

message SettlementRequest {
  string settlement_id = 1;
  string player_id = 2;
  string asset_type = 3;
  int64 delta = 4;
  string reason = 5;
  string source = 6;
}

message SettlementResponse {
  string settlement_id = 1;
  string player_id = 2;
  string asset_type = 3;
  int64 balance = 4;
  uint64 asset_version = 5;
  bool replayed = 6;
}

message EnterLobbyRequest {
  string player_id = 1;
  string session_id = 2;
  uint64 connection_epoch = 3;
}

message EnterLobbyResponse {
  string player_id = 1;
  string status = 2;
  uint64 state_version = 3;
}

message LeaveLobbyRequest {
  string player_id = 1;
  string session_id = 2;
  uint64 connection_epoch = 3;
  string reason = 4;
}

message LeaveLobbyResponse {
  string player_id = 1;
  string status = 2;
  uint64 state_version = 3;
}
