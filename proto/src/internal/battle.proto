syntax = "proto3";

package game01.internal;

option go_package = "server/proto/gen/internalpb;internalpb";

message BattlePlayerState {
  string player_id = 1;
  int32 hp = 2;
  float position_x = 3;
  float position_y = 4;
}

message BattleRoomSnapshot {
  uint64 room_id = 1;
  uint64 tick = 2;
  uint64 state_version = 3;
  string status = 4;
  repeated BattlePlayerState players = 5;
  int64 updated_at_unix_milli = 6;
}

message BattleRoomDelta {
  uint64 room_id = 1;
  uint64 from_state_version = 2;
  uint64 to_state_version = 3;
  uint64 tick = 4;
  string status = 5;
  repeated BattlePlayerState upsert_players = 6;
  repeated string removed_player_ids = 7;
}
