syntax = "proto3";

package game01.internal;

import "internal/stream.proto";

option go_package = "server/proto/gen/internalpb;internalpb";

enum InternalMessageId {
  INTERNAL_MESSAGE_ID_UNSPECIFIED = 0;
  INTERNAL_MESSAGE_ID_SERVICE_STATUS_REQUEST = 1;
  INTERNAL_MESSAGE_ID_SERVICE_STATUS_RESPONSE = 101;
  INTERNAL_MESSAGE_ID_RESTORE_PLAYER_STATE_REQUEST = 2001;
  INTERNAL_MESSAGE_ID_RESTORE_PLAYER_STATE_RESPONSE = 2101;
}

message ServiceStatusRequest {}

message ServiceStatusResponse {
  ServiceType service_type = 1;
  string instance_id = 2;
  bool available = 3;
}

message RestorePlayerStateRequest {
  string player_id = 1;
  string session_id = 2;
}

message RestorePlayerStateResponse {
  ServiceType service_type = 1;
  string player_id = 2;
  uint64 state_version = 3;
  bytes snapshot = 4;
  bool available = 5;
}
