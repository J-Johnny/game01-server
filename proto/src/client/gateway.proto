syntax = "proto3";

package game01.client.gateway;

option go_package = "server/proto/gen/client/gateway;gatewaypb";
option csharp_namespace = "Game01.Protocol.Client.Gateway";

enum ClientMessageId {
  CLIENT_MESSAGE_ID_UNSPECIFIED = 0;
  CLIENT_MESSAGE_ID_LOGIN_REQUEST = 1;
  CLIENT_MESSAGE_ID_RESUME_REQUEST = 2;
  CLIENT_MESSAGE_ID_REFRESH_LOGIN_REQUEST = 3;
  CLIENT_MESSAGE_ID_LOGIN_RESPONSE = 101;
  CLIENT_MESSAGE_ID_RESUME_RESPONSE = 102;
  CLIENT_MESSAGE_ID_REFRESH_LOGIN_RESPONSE = 103;
  CLIENT_MESSAGE_ID_STATE_RESTORE_EVENT = 104;
  CLIENT_MESSAGE_ID_ERROR_RESPONSE = 900;
}

enum AuthProvider {
  AUTH_PROVIDER_UNSPECIFIED = 0;
  AUTH_PROVIDER_GUEST = 1;
  AUTH_PROVIDER_STEAM = 2;
  AUTH_PROVIDER_APPLE = 3;
  AUTH_PROVIDER_GOOGLE = 4;
  AUTH_PROVIDER_WECHAT = 5;
  AUTH_PROVIDER_PASSWORD = 6;
}

message Envelope {
  ClientMessageId message_id = 1;
  uint64 request_id = 2;
  string session_id = 3;
  bytes payload = 4;
}

message LoginRequest {
  AuthProvider provider = 1;
  string credential = 2;
  string install_id = 3;
  string username = 4;
  string password = 5;
  string idempotency_key = 6;
}

message LoginResponse {
  string account_id = 1;
  string session_id = 2;
  string resume_token = 3;
  uint64 connection_epoch = 4;
  string refresh_token = 5;
  int64 refresh_token_expire_at_unix = 6;
  string player_id = 7;
}

message RefreshLoginRequest {
  string refresh_token = 1;
  string install_id = 2;
  string idempotency_key = 3;
}

message RefreshLoginResponse {
  string account_id = 1;
  string session_id = 2;
  string resume_token = 3;
  uint64 connection_epoch = 4;
  string refresh_token = 5;
  int64 refresh_token_expire_at_unix = 6;
  string player_id = 7;
}

message ResumeRequest {
  string session_id = 1;
  string resume_token = 2;
  map<string, uint64> state_versions = 3;
}

message ResumeResponse {
  string account_id = 1;
  string session_id = 2;
  string resume_token = 3;
  uint64 connection_epoch = 4;
  string player_id = 5;
}

message ErrorResponse {
  uint32 code = 1;
  string message = 2;
}

message StateRestoreEvent {
  string service = 1;
  string player_id = 2;
  uint64 state_version = 3;
  bytes snapshot = 4;
  bool available = 5;
  RestoreMode mode = 6;
  uint64 base_state_version = 7;
  StatePayloadType payload_type = 8;
  uint32 schema_version = 9;
}

enum RestoreMode {
  RESTORE_MODE_FULL = 0;
  RESTORE_MODE_DELTA = 1;
  RESTORE_MODE_NOOP = 2;
}

enum StatePayloadType {
  STATE_PAYLOAD_TYPE_UNSPECIFIED = 0;
  STATE_PAYLOAD_TYPE_LOBBY_SNAPSHOT = 1;
  STATE_PAYLOAD_TYPE_BATTLE_SNAPSHOT = 2;
  STATE_PAYLOAD_TYPE_BATTLE_DELTA = 3;
}
